server {
    listen 80;
    server_name _;

    # cap upload size so large document/collateral files aren't rejected by
    # nginx before they reach Kong (adjust to the largest file users compare)
    client_max_body_size 50m;

    # --- single-page app ---
    # serve static files; any unknown path falls back to index.html so
    # Angular's client-side router handles it (deep links, refresh on a route)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # index.html names each build's hashed chunk files (main-<hash>.js,
    # chunk-<hash>.css, ...) — a stale cached copy of it points at filenames
    # that no longer exist in a newer image once one has been redeployed, and
    # nginx sends no Cache-Control by default, only ETag/Last-Modified, which
    # a browser can serve from disk without ever re-checking. Every deploy
    # instead of just this fix would look "broken" until a hard refresh.
    # `=404` also covers the SPA fallback above, when try_files serves this
    # for an unmatched path.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # The hashed build output itself is the opposite case: its filename
    # already changes on every build, so nothing is ever served from cache
    # incorrectly — cache it hard, for as long as a browser will keep it.
    location ~* \.(?:js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- API ---
    # forward everything under /api/ to Kong. "kong" is the compose service
    # name, reachable on the internal Docker network; Kong listens on :80.
    location /api/ {
        proxy_pass http://kong:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # collateral/valuation/insurance reviews run an LLM pipeline that can
        # take minutes; Kong's routes for those are already given 310s of
        # headroom (see kong.yml) — nginx's 60s default would otherwise cut
        # the response off first.
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
}
