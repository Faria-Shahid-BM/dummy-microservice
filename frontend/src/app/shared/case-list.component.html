<div class="topbar">
  <h2>{{ caseService.label }} Cases</h2>
</div>

<section class="card">
  <div class="log-header">
    <h2>All cases</h2>
    <div class="button-row">
      <div class="topbar-item">
        <button type="button" (click)="toggleAddCase()">+ Add case</button>
        <div class="topbar-dropdown" *ngIf="showAddCase">
          <div class="field">
            <span>Case name</span>
            <input
              type="text"
              [(ngModel)]="newCaseName"
              name="newCaseName"
              (keydown.enter)="createCase()"
              autofocus
            />
          </div>
          <button [disabled]="creating || !newCaseName.trim()" (click)="createCase()">
            {{ creating ? 'Creating…' : 'Create' }}
          </button>
          <p class="error" *ngIf="createError">{{ createError }}</p>
        </div>
      </div>
      <button class="clear" (click)="load()" [disabled]="loading">
        {{ loading ? 'Loading…' : 'Refresh' }}
      </button>
    </div>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>
  <p class="empty" *ngIf="!loading && !cases.length">No cases yet.</p>

  <table class="audit-table" *ngIf="cases.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Uploads</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of cases">
        <td>{{ c.name }}</td>
        <td>{{ c.status }}</td>
        <td>{{ (c.uploads | keyvalue)?.length || 0 }}</td>
        <td>
          <a [routerLink]="[caseService.routeBase, 'cases', c.id]"><button type="button" class="clear">Open</button></a>
        </td>
      </tr>
    </tbody>
  </table>
</section>
