<div class="topbar">
  <h2>{{ caseService.label }} Cases</h2>
</div>

<section class="card">
  <div class="log-header">
    <h2>All cases</h2>
    <div class="button-row">
      <button type="button" class="clear" *ngIf="!caseService.hideAddCase" (click)="toggleAddCase()">+ Add case</button>
      <button class="clear" (click)="load()" [disabled]="loading">
        {{ loading ? 'Loading…' : 'Refresh' }}
      </button>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showAddCase && !caseService.hideAddCase" (click)="showAddCase = false">
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <h3>Add case</h3>
      <div class="field">
        <span>Case name</span>
        <input
          type="text"
          [(ngModel)]="newCaseName"
          name="newCaseName"
          (keydown.enter)="createCase()"
          autofocus
        />
      </div>
      <p class="error" *ngIf="createError">{{ createError }}</p>
      <div class="modal-actions">
        <button type="button" class="secondary" (click)="showAddCase = false">Cancel</button>
        <button [disabled]="creating || !newCaseName.trim()" (click)="createCase()">
          {{ creating ? 'Creating…' : 'Create' }}
        </button>
      </div>
    </div>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>

  <app-data-table
    [rows]="cases"
    [empty]="loading ? '' : caseService.hideAddCase
      ? 'No generated documents yet — generate one in Document Generator and it will appear here.'
      : 'No cases yet.'"
  >
    <ng-template appColumn header="Name" let-c>{{ c.name }}</ng-template>
    <ng-template appColumn header="Status" let-c>{{ c.status }}</ng-template>
    <ng-template appColumn header="Uploads" let-c>{{ (c.uploads | keyvalue)?.length || 0 }}</ng-template>
    <ng-template appColumn header="Last reviewed" *ngIf="caseService.showReviewedAt" let-c>
      {{ c.reviewed_at ? (c.reviewed_at | date:'medium') : 'Not yet reviewed' }}
    </ng-template>
    <ng-template appColumn header="" let-c>
      <a [routerLink]="[caseService.routeBase, 'cases', c.id]"><button type="button" class="clear">Open</button></a>
    </ng-template>
  </app-data-table>
</section>
