<div class="topbar">
  <div class="docgen-header-info">
    <h2>Document Generation</h2>
    <p class="subtitle" *ngIf="docgen.activeProfile">{{ docgen.activeProfile.name }}</p>
    <p class="subtitle" *ngIf="!docgen.activeProfile && !loadingProfile">No profile available</p>
  </div>
</div>

<nav class="tab-bar" aria-label="Document generation sections">
  <a routerLink="/docgen/cases" routerLinkActive="active" class="tab-item">Cases</a>
  <a routerLink="/docgen/templates" routerLinkActive="active" class="tab-item">Templates</a>
  <a routerLink="/docgen/approvals" routerLinkActive="active" class="tab-item">Approvals</a>
</nav>

<p class="error" *ngIf="profileError">{{ profileError }}</p>
<router-outlet *ngIf="!loadingProfile && docgen.activeProfile"></router-outlet>
