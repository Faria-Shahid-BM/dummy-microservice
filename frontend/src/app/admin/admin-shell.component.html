<div class="app-shell">
  <nav class="sidebar">
    <h1>Admin Dashboard</h1>
    <p class="subtitle">Audit trail &amp; user management</p>

    <a routerLink="/admin/audit" routerLinkActive="active" class="sidebar-item">Audit trail</a>
    <a
      routerLink="/admin/users"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-item"
      >Users</a
    >
    <a routerLink="/admin/users/new" routerLinkActive="active" class="sidebar-item">Add a user</a>
    <a routerLink="/dashboard" class="sidebar-item sidebar-item--top">← Back to dashboard</a>

    <div class="sidebar-footer">
      <div>{{ session.session?.username }} — {{ (session.session?.scopes ?? []).join(', ') }}</div>
      <button (click)="logout()">Log out</button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
