<header class="topbar-bar">
  <div class="topbar-left">
    <a routerLink="/dashboard" class="topbar-brand">CAD Workbench</a>
  </div>

  <div class="topbar-actions">
    <div class="topbar-item" *ngIf="hasDocgenAccess">
      <button type="button" class="icon-button" (click)="toggleNotifications()" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm7-6.5v-4.5a7 7 0 00-5.5-6.84V3.5a1.5 1.5 0 00-3 0v.66A7 7 0 005 11v4.5l-1.71 1.71c-.63.63-.19 1.79.7 1.79h15.02c.89 0 1.33-1.16.7-1.79z"
          />
        </svg>
        <span class="icon-badge" *ngIf="unreadCount">{{ unreadCount }}</span>
      </button>

      <div class="topbar-dropdown topbar-dropdown--right" *ngIf="showNotifications">
        <div class="log-header">
          <span>Notifications</span>
          <button class="clear" (click)="markAllRead()" [disabled]="!unreadCount">Mark all read</button>
        </div>
        <p class="empty" *ngIf="!notifications.length">No notifications yet.</p>
        <div class="notification-item" *ngFor="let n of notifications" [class.unread]="!n.read">
          <div class="notification-title">{{ n.title }}</div>
          <div class="notification-body" *ngIf="n.body">{{ n.body }}</div>
        </div>
      </div>
    </div>

    <!-- Configuration moved here from the service rail: it is not a reviewer,
         and sitting among them read as one. Between the bell and the account
         menu, so the header runs alerts -> settings -> account. -->
    <div class="topbar-item">
      <a routerLink="/configuration" routerLinkActive="active" class="icon-button" title="Configuration" aria-label="Configuration">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.67 8.84a.5.5 0 00.12.64l2.03 1.58a7.07 7.07 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"
          />
        </svg>
      </a>
    </div>

    <div class="topbar-item">
      <button type="button" class="profile-circle" (click)="toggleProfile()" aria-label="Account menu">
        {{ initials }}
      </button>

      <div class="topbar-dropdown topbar-dropdown--right" *ngIf="showProfile">
        <div class="profile-username">{{ session.session?.username }}</div>
        <div class="profile-scopes">{{ (session.session?.scopes ?? []).join(', ') }}</div>
        <button type="button" class="secondary" (click)="logout()">Log out</button>
      </div>
    </div>
  </div>
</header>
