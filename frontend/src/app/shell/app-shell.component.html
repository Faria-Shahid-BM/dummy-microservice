<div class="app-shell" [class.sidebar-collapsed]="sidebarToggle.collapsed">
  <nav class="sidebar">
    <ng-container *ngIf="!sidebarToggle.collapsed">
      <p class="subtitle">Services available to you</p>

      <ng-container *ngFor="let s of catalog.entitledServices">
        <!-- A routed item needs no catalog.select(): routerLinkActive already
             highlights it, and ServiceCatalogService only cares about
             "selected" for the still-inline Policy Q&A panel below. -->
        <a *ngIf="s.route" [routerLink]="s.route" routerLinkActive="active" class="sidebar-item">{{ s.label }}</a>
        <button *ngIf="!s.route" class="sidebar-item" [class.active]="catalog.selected?.key === s.key" (click)="selectKind(s)">
          {{ s.label }}
        </button>
      </ng-container>

      <p class="empty" *ngIf="!catalog.entitledServices.length">
        No services granted yet — ask an admin.
      </p>

      <!-- Not a reviewer, so it sits with the other non-service links rather
           than in the entitled-services list above. -->
      <a routerLink="/configuration" routerLinkActive="active" class="sidebar-item sidebar-item--top">
        Configuration
      </a>
      <a routerLink="/admin" *ngIf="session.isAdmin" class="sidebar-item">
        Admin dashboard
      </a>
    </ng-container>

    <ng-container *ngIf="sidebarToggle.collapsed">
      <ng-container *ngFor="let s of catalog.entitledServices">
        <a
          *ngIf="s.route"
          [routerLink]="s.route"
          routerLinkActive="active"
          class="sidebar-item-mini"
          [attr.title]="s.label"
          >{{ s.short }}</a
        >
        <button
          *ngIf="!s.route"
          class="sidebar-item-mini"
          [class.active]="catalog.selected?.key === s.key"
          [attr.title]="s.label"
          (click)="selectKind(s)"
        >
          {{ s.short }}
        </button>
      </ng-container>

      <a
        routerLink="/configuration"
        routerLinkActive="active"
        class="sidebar-item-mini sidebar-item-mini--top"
        title="Configuration"
        >CF</a
      >
      <a
        routerLink="/admin"
        *ngIf="session.isAdmin"
        class="sidebar-item-mini"
        title="Admin dashboard"
        >AD</a
      >
    </ng-container>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
