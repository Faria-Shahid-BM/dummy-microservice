<div class="topbar">
  <!-- Which reviewer this case belongs to, then the case: inside a case the
       name alone doesn't say what you're looking at. Same wording as that
       reviewer's list page, and it links back there. -->
  <h2 class="crumbs">
    <a class="crumb-link" [routerLink]="[valuation.routeBase, 'cases']">{{ valuation.label }} Cases</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span>{{ case?.name || 'Case' }}</span>
  </h2>
  <a [routerLink]="[valuation.routeBase, 'cases']" class="back-link">← All cases</a>
</div>

<p class="error" *ngIf="error">{{ error }}</p>

<ng-container *ngIf="case">
  <section class="card">
    <h2>Review a valuation report</h2>

    <!-- A run of the whole case, so it belongs in the tab strip beside Add and
         Remove rather than under a pair's panel, where it read as that pair's
         button — the one thing it never is. -->
    <ng-template #caseActions>
      <button [disabled]="!canAnalyze || analyzing" (click)="analyze(pendingPairs ? 'pending' : 'all')">
        {{ analyzeLabel }}
      </button>
    </ng-template>

    <!-- Above the tab strip, next to the button that raises it. -->
    <p class="error" *ngIf="analyzeError">{{ analyzeError }}</p>

    <!-- The same slots again, as many times as needed: every pair on this
         case is reviewed in its own pass and keeps its own result below. -->
    <app-case-pairs
      part="uploads"
      [service]="valuation"
      [case]="case"
      [run]="run"
      [analyzing]="analyzing || serverBusy"
      [tabActions]="caseActions"
      (caseChanged)="case = $event"
      (analyzePair)="analyze($event)"
    ></app-case-pairs>

    <p class="hint">Calls a real LLM — this can take a little while.</p>
  </section>


  <p class="error" *ngIf="case.status === 'failed' && case.error">{{ case.error }}</p>

  <section class="card">
    <h2>Results</h2>
    <!-- One tab per pair on this case, each holding that pair's own result. -->
    <app-case-pairs
      part="results"
      [service]="valuation"
      [case]="case"
      [run]="run"
      [stages]="valuationStages"
      [resultTemplate]="pairResult"
      [analyzing]="analyzing || serverBusy"
      (analyzePair)="analyze($event)"
    ></app-case-pairs>
  </section>

  <ng-template #pairResult let-result>
    <app-section-report [spec]="reportSpec" [result]="result"></app-section-report>
  </ng-template>
</ng-container>
