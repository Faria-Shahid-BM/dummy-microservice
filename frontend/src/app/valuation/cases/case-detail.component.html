<div class="topbar">
  <h2>{{ case?.name || 'Case' }}</h2>
  <a routerLink="/valuation/cases" class="back-link">← All cases</a>
</div>

<p class="error" *ngIf="error">{{ error }}</p>

<ng-container *ngIf="case">
  <section class="card">
    <h2>Review a valuation report</h2>
    <div class="file-field">
      <span>Valuation report (.docx or .pdf) — {{ case.uploads['report'] || 'not uploaded' }}</span>
      <input
        type="file"
        accept=".docx,.pdf"
        [disabled]="uploading['report'] || case.status === 'analyzing'"
        (change)="onSlotFile('report', $event)"
      />
      <span class="hint" *ngIf="uploading['report']">Uploading…</span>
    </div>
    <p class="error" *ngIf="uploadError">{{ uploadError }}</p>

    <!-- Same upload block, repeatable: each extra one becomes its own case,
         reviewed after this one when Review is pressed. -->
    <app-batch-add
      [service]="valuation"
      [disabled]="analyzing || case.status === 'analyzing'"
      (finished)="loadCase()"
    ></app-batch-add>

    <button [disabled]="(!canAnalyze && !hasExtras) || analyzing" (click)="analyze()">
      {{ analyzing ? 'Reviewing…' : case.status === 'done' || case.status === 'failed' ? 'Re-review' : 'Review' }}
    </button>
    <p class="error" *ngIf="analyzeError">{{ analyzeError }}</p>
    <p class="hint">Calls a real LLM — this can take a little while.</p>
  </section>

  <section class="card" *ngIf="analyzing">
    <h2>Progress</h2>
    <app-stage-progress
      [steps]="valuationStages"
      [currentKey]="progress.stageKey"
      [detail]="progress.detail"
      [complete]="progress.complete"
    ></app-stage-progress>
  </section>

  <p class="error" *ngIf="case.status === 'failed' && case.error">{{ case.error }}</p>

  <section class="card" *ngIf="case.result">
    <h2>Result</h2>
    <app-json-view [value]="case.result"></app-json-view>
  </section>
</ng-container>
