_format_version: "3.0"

services:
  - name: service-a
    url: http://service-a:8000
    routes:
      - name: service-a-route
        paths:
          - /api/a
        strip_path: true
        plugins:
          - name: jwt

  - name: service-b
    url: http://service-b:8000
    routes:
      - name: service-b-route
        paths:
          - /api/b
        strip_path: true
        plugins:
          - name: jwt

  - name: auth-service
    url: http://auth-service:8000
    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: true
        # no jwt plugin here — you can't need a token to get a token

  - name: audit-service
    url: http://audit-service:8000
    routes:
      - name: audit-read-route
        paths:
          - /api/audit
        methods:
          - GET
        strip_path: true
        plugins:
          - name: jwt
        # only GET is routed here — audit-service's own /audit POST stays
        # reachable only from service-a/b over the internal Docker network,
        # never through Kong

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:4200
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true

consumers:
  - username: app-consumer
    jwt_secrets:
      - key: poc-app
        secret: supersecretkey
