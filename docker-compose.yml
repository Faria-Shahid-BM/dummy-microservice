services:
  kong:
    image: kong:3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:80"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: "info"
      KONG_PLUGINS: "bundled,service-entitlement"
      KONG_LUA_PACKAGE_PATH: "/custom-plugins/?.lua;/custom-plugins/?/init.lua;;"
    ports:
      - "80:80"
      - "8001:8001"
    volumes:
      - ./kong.yml:/kong.yml
      - ./kong-plugins:/custom-plugins:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-a:
    build:
      context: .
      dockerfile: service-a/Dockerfile
    depends_on:
      kong:
        condition: service_healthy

  service-b:
    build:
      context: .
      dockerfile: service-b/Dockerfile
    depends_on:
      kong:
        condition: service_healthy

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    volumes:
      - ./audit-logs:/app/logs

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      kong:
        condition: service_healthy


