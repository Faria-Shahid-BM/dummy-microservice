services:
  kong:
    image: kong:3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:80"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: "info"
    ports:
      - "80:80"
      - "8001:8001"
    volumes:
      - ./kong.yml:/kong.yml
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-a:
    build: ./service-a
    depends_on:
      kong:
        condition: service_healthy

  service-b:
    build: ./service-b
    depends_on:
      kong:
        condition: service_healthy

  audit-service:
    build: ./audit-service
    volumes:
      - ./audit-logs:/app/logs


