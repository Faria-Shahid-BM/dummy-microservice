# Alembic configuration — CAD Workbench backend.
# The database URL is NOT set here; alembic/env.py reads it from
# app.core.config settings (DATABASE_URL env var / backend/.env).
# Run from the backend/ directory: python -m alembic upgrade head

[alembic]
script_location = alembic
# make "app" importable when alembic is invoked from backend/
prepend_sys_path = .
path_separator = os

# Logging configuration (consumed by env.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
